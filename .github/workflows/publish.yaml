name: Workrave build containers

on:
  push:
    branches: [master]
    paths:
      - 'debian-testing/**'
      - 'ubuntu-pbuilder/**'
      - 'ubuntu-cross-aarch64/**'
      - 'ubuntu-jammy/**'
      - 'ubuntu-noble/**'
      - 'ubuntu-resolute/**'
      - 'ubuntu-stonking/**'
      - 'llvm-mingw/**'
      - 'windows-msys2/**'
      - 'windows-conan/**'
      - '.github/workflows/**'
      - '.github/scripts/**'
      - '.gitattributes'
  workflow_dispatch:
    inputs:
      image:
        description: Image to rebuild
        type: choice
        default: all
        options:
          - all
          - debian-testing
          - ubuntu-pbuilder
          - ubuntu-cross-aarch64
          - ubuntu-jammy
          - ubuntu-noble
          - ubuntu-resolute
          - ubuntu-stonking
          - llvm-mingw
          - windows-msys2
          - windows-conan

permissions:
  contents: read

jobs:
  changes:
    name: Select changed images
    runs-on: ubuntu-26.04
    outputs:
      linux: ${{ steps.select.outputs.linux }}
      windows: ${{ steps.select.outputs.windows }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Test image selection
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Select images
        id: select
        env:
          REQUESTED_IMAGE: ${{ inputs.image || 'all' }}
        run: python3 .github/scripts/select-images.py

  build_linux:
    needs: changes
    if: needs.changes.outputs.linux != '[]'
    name: Linux ${{ matrix.image }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.linux) }}
    uses: ./.github/workflows/build-linux-image.yml
    with:
      image: ${{ matrix.image }}
      platforms: ${{ (matrix.image == 'ubuntu-cross-aarch64' || matrix.image == 'llvm-mingw') && '["linux/amd64"]' || '["linux/amd64", "linux/arm64"]' }}
    secrets: inherit

  build_windows:
    needs: changes
    if: needs.changes.outputs.windows != '[]'
    name: Windows ${{ matrix.image }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.windows) }}
    uses: ./.github/workflows/build-windows-image.yml
    with:
      image: ${{ matrix.image }}
    secrets: inherit
