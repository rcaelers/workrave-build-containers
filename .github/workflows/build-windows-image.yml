name: Build Windows Image

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/workrave-build

jobs:
  build:
    runs-on: windows-2025
    name: Build ${{ inputs.image }}
    timeout-minutes: 120
    concurrency:
      group: container-${{ inputs.image }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        env:
          IMAGE: ${{ inputs.image }}
        shell: pwsh
        run: |
          $tag = "$($env:REGISTRY_IMAGE):$($env:IMAGE)"
          $contextHash = python .github/scripts/context-hash.py $env:IMAGE
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          docker info --format 'Server={{.ServerVersion}} Driver={{.Driver}} Root={{.DockerRootDir}}'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, Used, Free | Format-Table
          # A published Windows image can retain an entire obsolete base and
          # toolchain while Docker builds their replacements. Avoid that extra
          # disk usage on the hosted runner, especially when committing MSVC.
          docker build --isolation=process --tag $tag --label "org.workrave.sdk-context=$contextHash" "./$($env:IMAGE)"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Diagnose failed Windows build
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, Used, Free | Format-Table
          docker system df
          Get-WinEvent -FilterHashtable @{LogName='Application'; ProviderName='docker'} -MaxEvents 30 -ErrorAction SilentlyContinue |
            Format-List TimeCreated, LevelDisplayName, Message

      - name: Publish
        env:
          IMAGE: ${{ inputs.image }}
        shell: pwsh
        run: docker push "$($env:REGISTRY_IMAGE):$($env:IMAGE)"
