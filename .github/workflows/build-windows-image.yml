name: Build Windows Image

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/workrave-build

jobs:
  build:
    runs-on: windows-2025
    name: Build ${{ inputs.image }}
    timeout-minutes: 120
    concurrency:
      group: container-${{ inputs.image }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Docker storage on the build drive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'Docker storage relocation is only intended for disposable GitHub-hosted runners'
          }
          # C: has too little space for the MSYS2/MSVC image and the temporary
          # copy Docker writes when committing a layer. D: is the large build drive.
          $volume = Get-Volume -DriveLetter D
          if ($volume.FileSystem -ne 'NTFS' -or $volume.SizeRemaining -lt 64GB) {
            throw 'The Windows container build requires an NTFS D: drive with at least 64 GiB free'
          }
          $dataRoot = 'D:\workrave-docker'
          $configPath = Join-Path $env:ProgramData 'docker\config\daemon.json'
          $config = if (Test-Path $configPath) {
            Get-Content $configPath -Raw | ConvertFrom-Json
          } else {
            [pscustomobject]@{}
          }
          $config | Add-Member -NotePropertyName 'data-root' -NotePropertyValue $dataRoot -Force
          Stop-Service docker
          New-Item -ItemType Directory -Force -Path (Split-Path $configPath), $dataRoot | Out-Null
          $config | ConvertTo-Json -Depth 20 | Set-Content $configPath -Encoding utf8
          Start-Service docker
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            $actualRoot = docker info --format '{{.DockerRootDir}}' 2>$null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 1
          }
          if ($LASTEXITCODE -ne 0 -or $actualRoot.TrimEnd('\') -ne $dataRoot) {
            throw "Docker did not start with the requested data root: $dataRoot"
          }
          Write-Host "Docker storage: $actualRoot ($([math]::Round($volume.SizeRemaining / 1GB, 1)) GiB free)"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        env:
          IMAGE: ${{ inputs.image }}
        shell: pwsh
        run: |
          $tag = "$($env:REGISTRY_IMAGE):$($env:IMAGE)"
          $contextHash = python .github/scripts/context-hash.py $env:IMAGE
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          docker info --format 'Server={{.ServerVersion}} Driver={{.Driver}} Root={{.DockerRootDir}}'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, Used, Free | Format-Table
          # A published Windows image can retain an entire obsolete base and
          # toolchain while Docker builds their replacements. Avoid that extra
          # disk usage on the hosted runner, especially when committing MSVC.
          docker build --isolation=process --tag $tag --label "org.workrave.sdk-context=$contextHash" "./$($env:IMAGE)"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Diagnose failed Windows build
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, Used, Free | Format-Table
          docker system df
          Get-WinEvent -FilterHashtable @{LogName='Application'; ProviderName='docker'} -MaxEvents 30 -ErrorAction SilentlyContinue |
            Format-List TimeCreated, LevelDisplayName, Message

      - name: Publish
        env:
          IMAGE: ${{ inputs.image }}
        shell: pwsh
        run: docker push "$($env:REGISTRY_IMAGE):$($env:IMAGE)"
