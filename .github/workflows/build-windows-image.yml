name: Build Windows Image

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/workrave-build

jobs:
  build:
    runs-on: windows-2025
    name: Build ${{ inputs.image }}
    timeout-minutes: 120
    concurrency:
      group: container-${{ inputs.image }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        env:
          IMAGE: ${{ inputs.image }}
        shell: pwsh
        run: |
          $tag = "$($env:REGISTRY_IMAGE):$($env:IMAGE)"
          $contextHash = python .github/scripts/context-hash.py $env:IMAGE
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # An absent published image is normal for the first build.
          docker pull $tag
          $global:LASTEXITCODE = 0
          docker build --isolation=process --cache-from $tag --tag $tag --label "org.workrave.sdk-context=$contextHash" "./$($env:IMAGE)"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Publish
        env:
          IMAGE: ${{ inputs.image }}
        shell: pwsh
        run: docker push "$($env:REGISTRY_IMAGE):$($env:IMAGE)"
